name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are reviewing a pull request to the capsa-agent-cookbook, a
            PUBLIC GitHub repository. Everything merged here is visible to
            anyone on the internet — customers, prospects, competitors, and
            crawlers. The cookbook holds customer-facing workflow
            documentation for the Capsa MCP connector: procedural recipes
            that show how an agent combines Capsa with other connected apps
            (email, calendar, docs) to do useful work.

            Your job is to make sure nothing slips into this repo that
            doesn't belong in public product documentation. Be thorough but
            practical — small style nits are not your job.

            Flag anything in the diff that falls into these categories:

            1. Internal infrastructure leaks. Terms or details that describe
               how Capsa is built, stored, synced, deployed, or authorized.
               This includes specific database engines, data warehouses,
               auth providers, cloud platforms, internal service names, and
               file paths from private repositories. The cookbook is about
               how to *use* the connector, not how it's built.

            2. Customer-identifying data. Real customer names, pilot account
               names, real email domains tied to real customers, raw IDs
               from private systems. All examples must be obviously
               fictional — the existing recipes use names like "Greenleaf
               Landscaping" and "Cedar Creek Lawn Care" with
               @example.com addresses; that pattern is the bar.

            3. Access-control internals. Descriptions of how permissions,
               role grants, tool packs, skill packs, or per-user permission
               lookups are wired up internally.

            4. Secrets, tokens, API keys, internal URLs, preview URLs, or
               signed links.

            5. Off-brand product framing. Content that breaks the cookbook's
               established shape: recipes are procedural, user-approval
               driven, never invent data, never send without review, never
               mark completion without evidence. Flag content that
               contradicts these principles.

            6. New public MCP tool names. If a recipe references a Capsa
               MCP tool name that is not already listed in README.md, call
               that out so a human can confirm the tool is intended to be
               on the public surface.

            Behavior:

            - Post inline review comments on the specific lines you're
              flagging. Be concrete about what is wrong and what the fix
              looks like.
            - End with a single summary comment: either "Public-safety
              review: no issues" or a short bulleted list of what you
              flagged and why.
            - The existing fictional examples and the established public
              vocabulary (Capsa MCP connector, follow-up actions, customer
              contact candidates, completion evidence, connected email
              provider, `capsa_describe_service`,
              `capsa_find_followup_actions`,
              `capsa_mark_followups_done`) are approved baselines. Don't
              flag those.

            Repository: ${{ github.repository }}
            Pull request: #${{ github.event.pull_request.number }}
